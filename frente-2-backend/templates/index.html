<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CardioIA - Assistente Cardiológico (página de teste do backend)</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        #chatbox { max-width: 640px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        .aviso { font-size: 0.85em; color: #7a2e2e; background: #fdecec; padding: 8px; border-radius: 6px; }
        .message { margin: 10px 0; }
        .user { font-weight: bold; }
        .bot { color: #0077cc; font-weight: bold; }
        .meta { color: #666; font-size: 0.8em; }
        #inputArea { margin-top: 20px; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px 20px; }
    </style>
</head>
<body>
    <div id="chatbox">
        <h2>CardioIA - Assistente Cardiológico</h2>
        <p class="aviso">{{ disclaimer }}</p>
        <p class="meta">Página de teste da Frente 2. A interface oficial é a da Frente 3.</p>
        <div id="messages"></div>

        <div id="inputArea">
            <input type="text" id="userInput" placeholder="Digite sua mensagem..." />
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

<script>
let sessionId = null;

function addMessage(cssClass, label, text, meta) {
    const messages = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "message " + cssClass;
    div.textContent = label + ": " + text;
    if (meta) {
        const span = document.createElement("div");
        span.className = "meta";
        span.textContent = meta;
        div.appendChild(span);
    }
    messages.appendChild(div);
}

function sendMessage() {
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text) return;

    addMessage("user", "Você", text);

    fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, session_id: sessionId })
    })
    .then(res => res.json())
    .then(data => {
        if (data.error) {
            addMessage("bot", "Erro", data.error + (data.detail ? " (" + data.detail + ")" : ""));
            return;
        }
        sessionId = data.session_id;
        const meta = data.intent ? "intent: " + data.intent + " (" + Number(data.confidence).toFixed(2) + ")" : "sem intent";
        addMessage("bot", "CardioIA", data.response || "(sem texto de resposta)", meta);
    })
    .catch(err => addMessage("bot", "Erro", String(err)));

    input.value = "";
}

document.getElementById("userInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
